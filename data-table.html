<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerPoint vs Canva データ表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f1a;
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 740px;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header .eyebrow {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .header .eyebrow::before,
  .header .eyebrow::after {
    content: '';
    display: inline-block;
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #a78bfa);
  }
  .header .eyebrow::after {
    background: linear-gradient(90deg, #a78bfa, transparent);
  }

  .header h1 {
    font-size: 1.7rem;
    font-weight: 900;
    color: #f1f5f9;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .header h1 .ppt  { color: #fb7185; }
  .header h1 .cnv  { color: #818cf8; }

  .header .desc {
    font-size: 0.85rem;
    color: #64748b;
  }

  /* テーブルラッパー */
  .table-wrap {
    background: linear-gradient(145deg, #1e1e32, #16162a);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(139,92,246,0.15),
      0 24px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  /* テーブルヘッダー */
  .table-header {
    display: grid;
    grid-template-columns: 120px 1fr 1fr;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 0 8px;
  }

  .th {
    padding: 16px 20px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .th.ppt-head  { color: #fb7185; }
  .th.cnva-head { color: #818cf8; }

  .th-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .ppt-dot  { background: #fb7185; box-shadow: 0 0 6px #fb7185; }
  .cnva-dot { background: #818cf8; box-shadow: 0 0 6px #818cf8; }

  /* テーブル行 */
  .table-row {
    display: grid;
    grid-template-columns: 120px 1fr 1fr;
    padding: 0 8px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
    position: relative;
  }

  .table-row:last-child { border-bottom: none; }
  .table-row:hover { background: rgba(255,255,255,0.03); }

  /* 逆転行ハイライト */
  .table-row.crossover {
    background: rgba(139,92,246,0.07);
    border-top: 1px solid rgba(139,92,246,0.25);
    border-bottom: 1px solid rgba(139,92,246,0.25);
  }

  .table-row.crossover::before {
    content: '🔀 逆転';
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    font-weight: 900;
    color: #a78bfa;
    background: rgba(139,92,246,0.15);
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 20px;
    padding: 3px 12px;
    letter-spacing: 0.05em;
  }

  .td {
    padding: 18px 20px;
    display: flex;
    align-items: center;
  }

  /* 年セル */
  .td.year {
    font-size: 1.05rem;
    font-weight: 900;
    color: #94a3b8;
  }

  /* バーセル */
  .td.bar-cell {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .bar-top {
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
  }

  .bar-value {
    font-size: 1.2rem;
    font-weight: 900;
  }

  .bar-pct {
    font-size: 0.75rem;
    opacity: 0.5;
  }

  .bar-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .bar-fill.ppt  {
    background: linear-gradient(90deg, #fb7185, #f43f5e);
    box-shadow: 0 0 8px rgba(251,113,133,0.5);
  }
  .bar-fill.cnva {
    background: linear-gradient(90deg, #818cf8, #6366f1);
    box-shadow: 0 0 8px rgba(129,140,248,0.5);
  }

  .ppt-value  { color: #fb7185; }
  .cnva-value { color: #818cf8; }

  /* フッター */
  .footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 4px;
  }

  .source {
    font-size: 0.75rem;
    color: #334155;
    line-height: 1.6;
  }

  .source strong { color: #475569; }

  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    color: #a78bfa;
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 99px;
    padding: 4px 14px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="eyebrow">Market Share Data</div>
    <h1><span class="ppt">PowerPoint</span> vs <span class="cnv">Canva</span></h1>
    <p class="desc">プレゼンテーションソフト 市場シェア推移（2018〜2024年）</p>
  </div>

  <div class="table-wrap">

    <div class="table-header">
      <div class="th">年</div>
      <div class="th ppt-head"><span class="th-dot ppt-dot"></span>PowerPoint</div>
      <div class="th cnva-head"><span class="th-dot cnva-dot"></span>Canva</div>
    </div>

    <!-- 2018 -->
    <div class="table-row">
      <div class="td year">2018</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">68</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:85%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">5</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:6.25%"></div></div>
      </div>
    </div>

    <!-- 2019 -->
    <div class="table-row">
      <div class="td year">2019</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">62</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:77.5%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">10</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:12.5%"></div></div>
      </div>
    </div>

    <!-- 2020 -->
    <div class="table-row">
      <div class="td year">2020</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">53</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:66.25%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">20</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:25%"></div></div>
      </div>
    </div>

    <!-- 2021 -->
    <div class="table-row">
      <div class="td year">2021</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">42</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:52.5%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">33</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:41.25%"></div></div>
      </div>
    </div>

    <!-- 2022 逆転 -->
    <div class="table-row crossover">
      <div class="td year">2022</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">33</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:41.25%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">45</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:56.25%"></div></div>
      </div>
    </div>

    <!-- 2023 -->
    <div class="table-row">
      <div class="td year">2023</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">25</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:31.25%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">52</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:65%"></div></div>
      </div>
    </div>

    <!-- 2024 -->
    <div class="table-row">
      <div class="td year">2024</div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value ppt-value">18</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ppt" style="width:22.5%"></div></div>
      </div>
      <div class="td bar-cell">
        <div class="bar-top">
          <span class="bar-value cnva-value">58</span>
          <span class="bar-pct">%</span>
        </div>
        <div class="bar-track"><div class="bar-fill cnva" style="width:72.5%"></div></div>
      </div>
    </div>

  </div><!-- /table-wrap -->

  <div class="footer">
    <div class="source">
      <strong>出典：</strong> 6sense Presentation Market Share Report・DemandSage・Backlinko をもとに作成
    </div>
    <div class="badge">プレゼンソフト市場シェア（%）</div>
  </div>

</div>

</body>
</html>
